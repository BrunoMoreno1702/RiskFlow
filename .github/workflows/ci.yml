name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  dags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem do Airflow
        run: docker build -f docker/airflow/Dockerfile -t riskflow-airflow .
      - name: DAGs importam sem erro
        run: >
          docker run --rm -e PYTHONPATH=/opt/riskflow -e AIRFLOW__CORE__LOAD_EXAMPLES=false
          -v "$PWD:/opt/riskflow:ro" riskflow-airflow python /opt/riskflow/scripts/check_dags.py

  # Teste de ponta a ponta contra Postgres real: backfill -> treino -> dia novo com score -> API.
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sobe Postgres e Source API
        run: docker compose up -d --build --wait postgres source-api
      - name: Backfill de 45 dias
        run: docker compose run --rm pipeline backfill --start 2026-06-01 --end 2026-07-15
      - name: Reprocessar um dia nao duplica dados
        run: |
          count() { docker compose exec -T postgres psql -U riskflow -d riskflow -tAc "select count(*) from mart.fct_transactions"; }
          before=$(count)
          docker compose run --rm pipeline daily --date 2026-07-01
          test "$before" = "$(count)"
      - name: Treino
        run: docker compose run --rm pipeline train
      - name: Dia novo com scoring
        run: |
          docker compose run --rm pipeline daily --date 2026-07-16
          scored=$(docker compose exec -T postgres psql -U riskflow -d riskflow -tAc \
            "select count(*) from mart.fraud_scores s join mart.fct_transactions f using (transaction_id) where f.event_date = '2026-07-16'")
          test "$scored" -gt 0
      - name: API de inferencia
        run: |
          docker compose up -d --wait inference-api
          curl -fsS localhost:8000/health | grep '"model_loaded":true'
          curl -fsS -X POST localhost:8000/predict -H 'content-type: application/json' \
            -d '{"customer_id":"CUST_00007","amount":5200,"merchant":"Kabum","category":"electronics","card_network":"Visa","timestamp":"2026-07-16T03:10:00"}'
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --tail 100
